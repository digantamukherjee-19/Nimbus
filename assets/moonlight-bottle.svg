<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%" role="img" aria-label="Moonlight bottle containing glowing celestial liquid and floating stars">
  <defs>
    <!-- Liquid Gradient for Moon Gold (default) -->
    <linearGradient id="goldLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5cf" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f8dc88" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e0a944" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glass Bottle Reflections -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="bottleHalo" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#fce8a6" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#fce8a6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fff8f1" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Halo (toggleable / animated) -->
  <circle class="bottle-glow-halo" cx="200" cy="270" r="160" fill="url(#bottleHalo)"/>

  <!-- Cork Stopper -->
  <g class="bottle-cork">
    <polygon points="175,65 225,65 232,100 168,100" fill="#c49a6c" stroke="#8a6138" stroke-width="2"/>
    <!-- Cork Texture Lines -->
    <line x1="180" y1="75" x2="195" y2="75" stroke="#9e7146" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="205" y1="85" x2="222" y2="85" stroke="#9e7146" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="175" y1="92" x2="190" y2="92" stroke="#9e7146" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Brass Lip / Neck Rim -->
  <rect x="160" y="98" width="80" height="14" rx="4" fill="#e7bf70" stroke="#966d21" stroke-width="1.5"/>

  <!-- Glass Bottle Body -->
  <!-- Outline & Shape: Vintage curved apothecary jar -->
  <g class="bottle-container">
    <!-- Bottle Base Drop Shadow -->
    <ellipse cx="200" cy="395" rx="90" ry="18" fill="#5c4033" opacity="0.15"/>

    <!-- Bottle Back Glass -->
    <path d="M172 112 L172 145 C172 170 120 190 120 230 L120 360 C120 385 140 395 200 395 C260 395 280 385 280 360 L280 230 C280 190 228 170 228 145 L228 112 Z" fill="#ffffff" fill-opacity="0.3" stroke="#9bb8c4" stroke-width="2.5"/>

    <!-- Glowing Moonlight Liquid Inside -->
    <g class="bottle-liquid">
      <path d="M123 250 C145 245 175 255 200 248 C225 242 255 252 277 248 L277 360 C277 382 258 392 200 392 C142 392 123 382 123 360 Z" fill="url(#goldLiquid)" filter="url(#glowEffect)"/>

      <!-- Liquid Surface Wave Highlight -->
      <path d="M124 250 C145 245 175 255 200 248 C225 242 255 252 276 248" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8"/>

      <!-- Floating Constellation / Stardust inside bottle -->
      <!-- Star 1 -->
      <g class="inner-star-1" transform="translate(160, 280) scale(0.9)">
        <polygon points="10,0 13,7 20,10 13,13 10,20 7,13 0,10 7,7" fill="#ffffff"/>
      </g>
      <!-- Star 2 -->
      <g class="inner-star-2" transform="translate(225, 310) scale(0.75)">
        <polygon points="10,0 13,7 20,10 13,13 10,20 7,13 0,10 7,7" fill="#ffffff"/>
      </g>
      <!-- Tiny Crescent Moon inside -->
      <g class="inner-moon" transform="translate(190, 320) scale(0.8)">
        <circle cx="16" cy="16" r="16" fill="#fffef7"/>
        <circle cx="21" cy="12" r="14" fill="#f8dc88"/>
      </g>
      <!-- Floating bubbles/sparks -->
      <circle cx="150" cy="330" r="3.5" fill="#ffffff" opacity="0.8"/>
      <circle cx="240" cy="275" r="3" fill="#ffffff" opacity="0.8"/>
      <circle cx="185" cy="360" r="2.5" fill="#ffffff" opacity="0.8"/>
      <circle cx="215" cy="350" r="4" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Glass Surface Specular Shines -->
    <path d="M132 205 L132 355 C132 368 138 375 148 380" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M142 215 L142 340" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M268 215 L268 350" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3"/>

    <!-- Vintage Paper Tag tied with Twine -->
    <!-- Twine around neck -->
    <ellipse cx="200" cy="120" rx="29" ry="6" fill="none" stroke="#a67c52" stroke-width="2"/>
    <path d="M178 122 C170 135 165 155 160 170" stroke="#a67c52" stroke-width="1.8" fill="none"/>
    <!-- Tag Card -->
    <g transform="translate(135, 168) rotate(-12)">
      <polygon points="0,0 60,0 65,36 0,36" fill="#fff8ea" stroke="#bfa686" stroke-width="1.5"/>
      <circle cx="8" cy="18" r="3" fill="#a67c52"/>
      <text x="18" y="16" font-family="monospace" font-size="7" font-weight="bold" fill="#754b2a">NIMBUS NO.2</text>
      <text x="18" y="27" font-family="sans-serif" font-size="7.5" fill="#a34063">Pure Moonlight</text>
    </g>
  </g>
</svg>
