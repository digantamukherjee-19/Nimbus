<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d6" stop-opacity="1"/>
      <stop offset="60%" stop-color="#e7bf70" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e7bf70" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5c4033" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Cloud base -->
  <g filter="url(#softShadow)">
    <path d="M18 46 C12 46 8 41 8 35 C8 29.5 12.5 25 18 25 C19 21 23 18 28 18 C33 18 37 21 39 25 C41 23 44 22 47 22 C53 22 57 26.5 57 32 C57 33 56.8 34 56.5 35 C58.5 37 60 40 60 43 C60 48 55.5 52 50 52 L22 52 C15 52 14 46 18 46 Z" fill="#fffdf9"/>
  </g>

  <!-- Nightcap on cloud -->
  <path d="M25 21 C22 14 30 7 36 6 C42 5 44 9 40 14 C37 17 33 19 25 21 Z" fill="#a34063"/>
  <circle cx="37" cy="6" r="3" fill="#e7bf70"/>

  <!-- Face details -->
  <!-- Left eye sleeping -->
  <path d="M22 36 Q25 39 28 36" stroke="#5c4033" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Right eye sleeping -->
  <path d="M36 36 Q39 39 42 36" stroke="#5c4033" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Smile -->
  <path d="M30 41 Q32 43 34 41" stroke="#5c4033" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Blush cheeks -->
  <ellipse cx="20" cy="39" rx="3" ry="2" fill="#f5a8b8" opacity="0.6"/>
  <ellipse cx="44" cy="39" rx="3" ry="2" fill="#f5a8b8" opacity="0.6"/>

  <!-- Tiny golden sparkling star -->
  <g transform="translate(48, 12)">
    <polygon points="6,0 7.5,4.5 12,6 7.5,7.5 6,12 4.5,7.5 0,6 4.5,4.5" fill="#e7bf70"/>
    <circle cx="6" cy="6" r="1.5" fill="#ffffff"/>
  </g>
</svg>
