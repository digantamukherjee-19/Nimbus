<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%" role="img" aria-label="Nimbus's Midnight Observatory, a cozy rounded dome perched on a soft fluffy cloud under a starry sky">
  <defs>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4e8"/>
      <stop offset="50%" stop-color="#f8e5d4"/>
      <stop offset="100%" stop-color="#e9d3c0"/>
    </linearGradient>

    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b85478"/>
      <stop offset="50%" stop-color="#a34063"/>
      <stop offset="100%" stop-color="#7a2a46"/>
    </linearGradient>

    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="70%" stop-color="#e7bf70"/>
      <stop offset="100%" stop-color="#d4a34b"/>
    </radialGradient>

    <filter id="sceneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5c4033" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Big Fluffy Cloud Base holding the Observatory -->
  <g class="foundation-cloud" filter="url(#sceneShadow)">
    <circle cx="150" cy="310" r="65" fill="#ffffff"/>
    <circle cx="230" cy="290" r="75" fill="#ffffff"/>
    <circle cx="320" cy="295" r="70" fill="#ffffff"/>
    <circle cx="380" cy="320" r="55" fill="#ffffff"/>
    <path d="M110 340 C110 370 390 370 390 340 Z" fill="#ffffff"/>
    <ellipse cx="250" cy="345" rx="140" ry="25" fill="#fff9f2"/>
  </g>

  <!-- Observatory Building Body -->
  <g class="observatory-building" filter="url(#sceneShadow)">
    <!-- Main cylindrical tower base -->
    <rect x="175" y="170" width="150" height="125" rx="12" fill="url(#domeGrad)" stroke="#cbb29b" stroke-width="2"/>
    <!-- Stone / wood panel accents -->
    <line x1="175" y1="210" x2="325" y2="210" stroke="#dbcaa0" stroke-width="1.5" stroke-dasharray="8,6"/>
    <line x1="175" y1="250" x2="325" y2="250" stroke="#dbcaa0" stroke-width="1.5" stroke-dasharray="8,6"/>

    <!-- Arched Wooden Door with Brass Knob -->
    <path d="M225 295 L225 245 C225 230 275 230 275 245 L275 295 Z" fill="#734d38" stroke="#4a2e1d" stroke-width="2"/>
    <circle cx="266" cy="265" r="3.5" fill="#e7bf70"/>
    <!-- Welcome Mat -->
    <ellipse cx="250" cy="296" rx="28" ry="6" fill="#e7e5f4" stroke="#c9b6e4" stroke-width="1.5"/>

    <!-- Round Glowing Window on the Tower -->
    <circle cx="198" cy="230" r="14" fill="url(#windowGlow)" stroke="#734d38" stroke-width="2"/>
    <line x1="198" y1="216" x2="198" y2="244" stroke="#734d38" stroke-width="1.5"/>
    <line x1="184" y1="230" x2="212" y2="230" stroke="#734d38" stroke-width="1.5"/>

    <!-- The Great Observatory Rotating Dome Roof -->
    <path d="M160 172 C160 95 340 95 340 172 Z" fill="url(#roofGrad)" stroke="#662038" stroke-width="2"/>
    <!-- Dome Base Ring / Track -->
    <rect x="155" y="166" width="190" height="12" rx="4" fill="#e7bf70" stroke="#9e7a2b" stroke-width="1.5"/>

    <!-- Dome Slit Aperture Opening -->
    <path d="M220 172 L230 98 L270 98 L280 172 Z" fill="#2c223b"/>

    <!-- Brass Telescope Emerging Through Slit -->
    <g class="observatory-scope" transform="translate(245, 130) rotate(-35)">
      <rect x="-10" y="-12" width="90" height="24" rx="4" fill="#e7bf70" stroke="#8c6418" stroke-width="1.5"/>
      <rect x="60" y="-14" width="14" height="28" rx="2" fill="#fff0b8"/>
      <ellipse cx="80" cy="0" rx="3" ry="14" fill="#a4d4f8"/>
      <line x1="78" y1="-8" x2="81" y2="-2" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Star Weathervane on Top of Dome -->
    <line x1="250" y1="96" x2="250" y2="60" stroke="#e7bf70" stroke-width="3" stroke-linecap="round"/>
    <polygon points="250,50 254,58 262,60 254,62 250,70 246,62 238,60 246,58" fill="#e7bf70"/>
    <circle cx="250" cy="60" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Hanging Lantern from Eaves -->
  <g class="dome-lantern" transform="translate(162, 178)">
    <line x1="0" y1="0" x2="0" y2="18" stroke="#5c4033" stroke-width="1.5"/>
    <polygon points="-7,18 7,18 5,32 -5,32" fill="url(#windowGlow)" stroke="#5c4033" stroke-width="1.2"/>
    <circle cx="0" cy="25" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Little Crescent Moon Signboard -->
  <g transform="translate(285, 230) rotate(5)">
    <rect x="0" y="0" width="34" height="20" rx="3" fill="#fff8ea" stroke="#8c6418" stroke-width="1.2"/>
    <text x="6" y="13" font-family="monospace" font-size="7" font-weight="bold" fill="#a34063">OBS-1</text>
  </g>
</svg>
